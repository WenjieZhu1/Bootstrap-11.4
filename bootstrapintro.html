
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost Cat Poster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

  <div class="container text-center mt-4">
    <h1 class="display-3 text-danger">LOST CAT!</h1>
    <p class="fs-5">My cat, Mr. Noodles, is missing!</p>
    <p>He is cute, lazy, and loves sleeping.</p>
    <p>He was last seen near my house.</p>
    <p>Please help me find him!</p>

    <div id="catPhotos" class="carousel slide mb-4">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=900&h=450&q=80" class="d-block w-100" alt="Cat photo 1">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=900&h=450&q=80" class="d-block w-100" alt="Cat photo 2">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=900&h=450&q=80" class="d-block w-100" alt="Cat photo 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#catPhotos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#catPhotos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <div class="border border-primary rounded p-3 mb-4 bg-white">
      <h2 class="text-primary">Can You Help?</h2>
      <p>Here are two helpful websites:</p>
      <a href="https://www.petfinder.com/" class="btn btn-primary btn-lg active" target="_blank" rel="noopener">Petfinder</a>
      <a href="https://www.aspca.org/pet-care" class="btn btn-success btn-sm" target="_blank" rel="noopener">Pet Care</a>
      <button class="btn btn-secondary" disabled>Found!</button>
    </div>

    <div class="mb-4 text-start">
      <h2 class="text-center">Contact Form</h2>
      <label for="name" class="form-label">Your Name</label>
      <input type="text" id="name" class="form-control mb-3" placeholder="Enter your name">

      <label for="message" class="form-label">Where did you see the cat?</label>
      <textarea id="message" class="form-control" rows="3" placeholder="Write a message"></textarea>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
